# Julkaisee sivun hessujarvinen.com/softa -kansioon aina, kun main-haaraan puskeaan
name: Julkaise saitille

on:
  push:
    branches: [main]
  workflow_dispatch:   # mahdollistaa myös käsin käynnistämisen Actions-välilehdeltä

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Siirrä FTP:llä
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            LICENSE
